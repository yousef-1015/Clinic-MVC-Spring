spring.application.name=Clinic-MVC-Spring

spring.datasource.url=jdbc:mysql://localhost:3306/hospitaldb?createDatabaseIfNotExist=false&serverTimezone=UTC


spring.datasource.username=root

spring.datasource.password=1234
#! for JPA
#keep data updated on every start don't delete
spring.jpa.hibernate.ddl-auto=update
#show sql line in console
# make it true in the dev profile
spring.jpa.show-sql=false

# show the sql line in console in a cleaner way
spring.jpa.properties.hibernate.format_sql=true
#translate to mysql type
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#ACTIVATING THE PROFILE
spring.profiles.active=dev