spring.application.name=Clinic-MVC-Spring

spring.datasource.url=jdbc:mysql://localhost:3306/hospitaldb?createDatabaseIfNotExist=false&serverTimezone=UTC


spring.datasource.username=root

spring.datasource.password=1234
#! for JPA
#keep data updated on every start don't delete
spring.jpa.hibernate.ddl-auto=update
#show sql line in console
# make it true in the dev profile
spring.jpa.show-sql=false

# show the sql line in console in a cleaner way
#spring.jpa.properties.hibernate.format_sql=true
#translate to mysql type
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#ACTIVATING THE PROFILE
spring.profiles.active=dev
# key used in verification (use the key to recompute the signature then compare)
application.security.jwt.secret-key = 339b66b1e4668bca8357465af57f141f538f6def6abb1b7c7d5fce7173bbfb67
#/ Default: 7 days in milliseconds (7 * 24 * 60 * 60 * 1000)
application.security.jwt.refresh-token.expiration=604800000



# Connection Pool Settings 
# The maximum number of connections pool will hold (active + idle)
spring.datasource.hikari.maximum-pool-size=15
# The minimum number of idle connections waiting in the pool
spring.datasource.hikari.minimum-idle=5
# How long a connection can be idle before being dropped (in milliseconds)
spring.datasource.hikari.idle-timeout=30000
# Time in connection queue
spring.datasource.hikari.connection-timeout=20000
# A name for the pool so you can spot it in your console logs!
spring.datasource.hikari.pool-name=ClinicHikariPool


#Redis configs
spring.data.redis.host=localhost
spring.data.redis.port=6379