version: '3.8'

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}

    restart: unless-stopped

    volumes:
      - clinic_db_data:/var/lib/mysql

    networks:
      - clinic_network
  

  app:
    build: .  #the Dockerfile in this directory
    ports:
      - "8080:8080"
    environment:                       #not localhost
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    networks:
      - clinic_network
    depends_on:
      - mysql #Wait for mysql to run first so i can connect to it
    restart: on-failure


volumes:
  clinic_db_data:

networks:
  clinic_network:
    driver: bridge